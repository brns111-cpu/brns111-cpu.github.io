<style>
:root{--ink:#241c10;--gold:#b8892b;--g2:#e6c76e;--paper:#fbf7ee;--grn:#23382c;--line:#d9c8a0}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;font:16px/1.7 Tajawal,Tahoma,sans-serif;background:var(--paper);color:var(--ink);padding-bottom:64px}
h1,h2,h3{font-family:Amiri,serif;margin:.3em 0}
header{background:var(--grn);color:var(--g2);padding:calc(8px + env(safe-area-inset-top)) 14px 8px;display:flex;align-items:center;gap:8px;position:sticky;top:0;z-index:5}
header h1{flex:1;font-size:22px;margin:0}header small{display:block;font:12px Tajawal;opacity:.8}
button,.btn{font:inherit;border:1px solid var(--gold);background:#fff;color:var(--ink);border-radius:8px;padding:5px 12px;cursor:pointer}
.btn{background:var(--gold);color:#fff}
nav{display:flex;overflow-x:auto;gap:6px;padding:8px;background:#f1e8d0}
nav button{white-space:nowrap}nav .on{background:var(--grn);color:var(--g2);border-color:var(--grn)}
main{padding:12px;max-width:1000px;margin:auto}
input,select,textarea{font:inherit;width:100%;padding:8px;border:1px solid var(--line);border-radius:8px;background:#fff}
label{display:block;margin:8px 0}.ck{display:flex;gap:8px;align-items:center}.ck input{width:auto}
.bar{display:flex;gap:6px}.row{display:flex;gap:8px;margin-top:12px}
#res button{display:block;width:100%;text-align:right;margin-top:4px}
#vp{height:62vh;overflow:hidden;position:relative;touch-action:none;border:1px solid var(--line);border-radius:10px;background:#fff;margin-top:8px}
#cv{position:absolute;right:0;top:0;transform-origin:100% 0;width:max-content;padding:12px}
.tr ul{display:flex;justify-content:center;padding:20px 0 0;margin:0;list-style:none;position:relative}
.tr ul ul::before{content:'';position:absolute;top:0;left:50%;height:20px;border-left:2px solid var(--gold)}
.tr li{position:relative;padding:20px 6px 0;display:flex;flex-direction:column;align-items:center}
.tr li::before,.tr li::after{content:'';position:absolute;top:0;width:50%;height:20px;border-top:2px solid var(--gold)}
.tr li::before{right:50%}.tr li::after{left:50%;border-left:2px solid var(--gold)}
.tr li:only-child{padding-top:0}.tr li:only-child::before,.tr li:only-child::after{display:none}
.tr li:first-child::after{border:0}.tr li:last-child::before{border:0}
.tr li:first-child:not(:only-child)::before{border-right:2px solid var(--gold)}
.tr>ul{padding-top:0}.tr>ul>li{padding-top:0}.tr>ul>li::before,.tr>ul>li::after{display:none}
.cd{display:flex;flex-direction:column;align-items:center;min-width:96px;border:1.5px solid var(--gold);background:linear-gradient(#fff,#f8efd6);border-radius:10px;padding:6px 12px;cursor:pointer;white-space:nowrap}
.tg{margin:4px 0;padding:0 10px;border-radius:50%}
.cd small{color:#7a6a45}.cd.hit{background:var(--g2)}.cd button{padding:0 8px}
.lc{margin-right:14px;padding-right:12px;border-right:2px solid var(--gold)}
.lr{display:flex;align-items:center;gap:8px;padding:5px 4px;border-radius:8px}.lr.hit{background:var(--g2)}
.lr .tg{width:34px;height:34px;padding:0;margin:0;border-radius:8px;flex:none}.lr .dot{width:34px;text-align:center;color:var(--gold);flex:none}
.nm{flex:1;cursor:pointer}.nm small{color:#7a6a45}#lt{margin-top:8px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px;overflow-x:auto}
.pi{max-width:100%;max-height:320px;border-radius:8px;margin:6px 0;cursor:zoom-in;display:block}
.ts{position:fixed;top:70px;right:12px;left:12px;background:var(--grn);color:var(--g2);padding:10px 14px;border-radius:10px;z-index:30;box-shadow:0 3px 10px #0005}
.cd.anc{border-style:dashed;background:#faf6ec}
.sts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}.sc{padding:10px 4px;text-align:center;font-size:15px;line-height:1.3}.sc b{font-size:28px}
.mem-h{background:var(--grn);color:var(--g2);text-align:center;padding:20px 12px;border-radius:16px}.mem-h h2{margin:6px 0}.mem-h p{color:#fff;margin:0}
.pc,.it{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin:10px 0}
.pc h3{margin:0}.sub,.empty{color:#7a6a45}
#md{position:fixed;inset:0;background:#0007;display:flex;align-items:center;justify-content:center;z-index:20;padding:12px}
.mc{background:var(--paper);border-radius:12px;padding:16px;width:min(480px,100%);max-height:90vh;overflow:auto}
dl{display:grid;grid-template-columns:auto 1fr;gap:2px 12px}dt{color:#7a6a45}dd{margin:0}
table{width:100%;border-collapse:collapse;background:#fff}td,th{border:1px solid var(--line);padding:6px;text-align:right}th{background:#f1e8d0}
#fab{position:fixed;right:14px;bottom:14px;width:56px;height:56px;border-radius:50%;background:#25d366;color:#fff;font-size:30px;display:flex;align-items:center;justify-content:center;text-decoration:none;box-shadow:0 3px 10px #0004;z-index:6}
#dsg{position:fixed;left:10px;bottom:6px;font-size:13px;color:var(--gold);z-index:6}
#pa{display:none}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}.g .it{text-align:center}.g .it span{font-size:34px}

body{font-size:17px;line-height:1.85;background:var(--paper)}
header{background:linear-gradient(135deg,#173a2c,#26604a);box-shadow:0 2px 12px #0003}

nav::-webkit-scrollbar{display:none}
