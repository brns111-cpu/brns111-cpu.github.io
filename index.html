.tr ul ul::before{content:'';position:absolute;top:0;left:50%;height:20px;border-left:2px solid var(--gold)}

.tr li::before,.tr li::after{content:'';position:absolute;top:0;width:50%;height:20px;border-top:2px solid var(--gold)}

.tr>ul{padding-top:0}.tr>ul>li{padding-top:0}.tr>ul>li::before,.tr>ul>li::after{display:none}
.cd{display:flex;flex-direction:column;align-items:center;min-width:96px;border:1.5px solid var(--gold);background:linear-gradient(#fff,#f8efd6);border-radius:10px;padding:6px 12px;cursor:pointer;white-space:nowrap}
